<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sloyka: 3D architecture, layer by layer</title>
<style>
  :root { --bg:#0b1020; --panel:#111827; --line:#1f2937; --text:#e5e7eb; --mute:#94a3b8; --acc:#38bdf8; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif; overflow:hidden; }
  #app { display:grid; grid-template-columns: 380px 1fr; height:100%; }
  aside { display:flex; flex-direction:column; background:var(--panel); border-right:1px solid var(--line); min-height:0; }
  .brand { padding:12px 14px 8px; display:flex; align-items:baseline; gap:8px; }
  .brand b { font-size:16px; letter-spacing:.2px; }
  .brand .logo { width:20px; height:20px; align-self:center; flex:none; }
  .brand span { color:var(--mute); font-size:12px; }
  .tabs { display:flex; gap:4px; padding:0 10px; border-bottom:1px solid var(--line); }
  .tab { flex:1; background:none; border:0; color:var(--mute); padding:10px 6px; font:inherit; border-bottom:2px solid transparent; cursor:pointer; }
  .tab.on { color:var(--text); border-bottom-color:var(--acc); }
  .pane { flex:1; min-height:0; overflow:auto; }
  .pane[data-pane="model"] { display:flex; flex-direction:column; overflow:hidden; }
  .pane[hidden] { display:none !important; }
  #editor { flex:1; width:100%; resize:none; border:0; outline:0; background:#0d1424; color:#e2e8f0; padding:12px 14px; font:12.5px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; tab-size:2; white-space:pre; }
  #msgs { max-height:30%; overflow:auto; border-top:1px solid var(--line); padding:8px 12px; font-size:12px; }
  .err { color:#fca5a5; } .warn { color:#fcd34d; } .ok { color:#86efac; }
  .row { display:flex; align-items:center; gap:8px; padding:7px 10px; cursor:pointer; border-left:2px solid transparent; }
  .row:hover { background:#172033; } .row.sel { background:#1e293b; border-left-color:var(--acc); } .row.dim { opacity:.4; }
  .dot, .swatch { width:10px; height:10px; border-radius:3px; flex:none; }
  .badge { margin-left:auto; color:var(--mute); font-size:11px; background:#1e293b; padding:1px 6px; border-radius:6px; }
  .layer { display:flex; align-items:center; gap:10px; padding:6px 12px; }
  .layer.focus { background:#1e293b; }
  .lname { flex:1; text-align:left; background:none; border:0; color:var(--text); font:inherit; padding:8px 0; cursor:pointer; }
  .lname small { color:var(--mute); margin-left:4px; }
  .eye { background:#1e293b; border:0; color:var(--text); width:34px; height:30px; border-radius:8px; cursor:pointer; }
  .hint, .empty { color:var(--mute); font-size:12px; padding:8px 14px; margin:0; }
  main { position:relative; min-width:0; min-height:0; }
  #viewport { position:absolute; inset:0; }
  #viewport canvas { display:block; width:100%; height:100%; touch-action:none; }
  .toolbar { position:absolute; top:10px; left:10px; right:90px; display:flex; gap:6px; flex-wrap:wrap; pointer-events:none; }
  .group { display:flex; gap:2px; background:rgba(17,24,39,.88); border:1px solid var(--line); border-radius:10px; padding:3px; pointer-events:auto; align-items:center; backdrop-filter:blur(6px); }
  .group button { background:none; border:0; color:var(--text); font:inherit; font-size:13px; padding:6px 9px; border-radius:7px; cursor:pointer; white-space:nowrap; }
  .group button:hover { background:#1f2937; } .group button.on { background:#0c4a6e; color:#e0f2fe; }
  .group button:disabled { opacity:.35; cursor:default; }
  .group select { background:none; border:0; color:var(--text); font:inherit; font-size:13px; padding:6px 4px; border-radius:7px; cursor:pointer; }
  .group select option { background:#111827; }
  .legend { padding:8px 14px 16px; display:grid; gap:6px; font-size:13px; border-top:1px solid var(--line); }
  .legend small { color:var(--mute); margin-left:4px; }
  .wire { display:inline-block; width:18px; height:4px; border-radius:2px; margin-right:8px; vertical-align:middle; }
  .cn .cd { color:var(--mute); font-size:12px; margin:2px 0 2px 26px; }
  .pc { max-height:180px !important; }
  .group label { color:var(--mute); font-size:12px; padding:0 4px 0 8px; display:flex; align-items:center; gap:6px; }
  .group input[type=range] { width:90px; accent-color:var(--acc); }
  #props { position:absolute; left:10px; bottom:34px; width:min(340px, calc(100% - 20px)); background:rgba(17,24,39,.94); border:1px solid var(--line); border-radius:12px; padding:12px; backdrop-filter:blur(6px); }
  #props[hidden] { display:none; }
  .ph { display:flex; align-items:center; gap:8px; font-size:15px; }
  .ph .x { margin-left:auto; background:none; border:0; color:var(--mute); cursor:pointer; font-size:14px; }
  .pm { color:var(--mute); font-size:12px; margin-top:4px; } .pm code { color:#cbd5e1; }
  .pd { margin-top:8px; font-size:13px; }
  .pc { margin-top:8px; display:grid; gap:4px; font-size:13px; max-height:120px; overflow:auto; }
  .pc .badge { margin-left:6px; }
  .pa { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
  .pa button, #modal button { background:#1e293b; color:var(--text); border:0; padding:7px 12px; border-radius:8px; font:inherit; cursor:pointer; }
  .pa button.on { background:#0c4a6e; }
  .help { position:absolute; bottom:8px; left:10px; right:10px; color:var(--mute); font-size:11.5px; pointer-events:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #toast { position:absolute; top:58px; left:50%; transform:translateX(-50%); background:#0c4a6e; color:#e0f2fe; padding:8px 14px; border-radius:8px; font-size:13px; }
  #toast[hidden] { display:none; }
  #modal { position:fixed; inset:0; background:rgba(2,6,23,.75); display:flex; align-items:center; justify-content:center; z-index:10; padding:16px; }
  #modal[hidden] { display:none; }
  #modal-body { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; max-width:900px; width:100%; max-height:90vh; overflow:auto; }
  #modal-body h3 { margin:0 0 4px; } #modal-body p { color:var(--mute); margin:0 0 10px; }
  #modal-body img { width:100%; border-radius:8px; display:block; margin-bottom:10px; }
  .flow { display:flex; align-items:flex-start; gap:8px; padding:4px 12px; border-left:2px solid transparent; }
  .flow.focus { background:#1e293b; border-left-color:#f8fafc; }
  .flow .lname { padding:8px 0; }
  .flow .fsw { margin-top:13px; }
  .ltype { display:flex; align-items:flex-start; gap:10px; padding:10px 12px 4px; border-top:1px solid var(--line); }
  .ltype .wire { margin-top:8px; flex:none; } .ltype .lt { flex:1; }
  .lrow { display:flex; align-items:center; gap:8px; padding:0 12px 0 40px; border-left:2px solid transparent; }
  .lrow .lname { font-size:13px; padding:6px 0; } .lrow .lname small { color:var(--mute); margin-left:4px; }
  .lrow.sel { background:#1e293b; border-left-color:var(--acc); } .lrow.dim .lname { opacity:.45; }
  .lrow .eye { width:30px; height:26px; flex:none; } .eye:disabled { opacity:.35; cursor:default; }
  .muted { color:var(--mute); font-size:12px; } .pc .link { text-align:left; }
  #props { max-height:62vh; overflow:auto; }
  .ups { margin-top:10px; display:grid; gap:6px; }
  .up { display:flex; align-items:center; gap:6px; font-size:13px; flex-wrap:wrap; }
  .up .ul { width:56px; color:var(--mute); }
  .up button { background:#1e293b; color:var(--text); border:0; width:26px; height:24px; border-radius:6px; cursor:pointer; font:inherit; }
  .up button:disabled { opacity:.35; cursor:default; }
  .up b { min-width:12px; text-align:center; } .up small { color:var(--mute); flex-basis:100%; padding-left:62px; }
  .vs { margin-top:12px; border-top:1px solid var(--line); padding-top:10px; }
  .vh { display:flex; align-items:center; gap:6px; flex-wrap:wrap; } .vh small { color:var(--mute); margin-right:auto; }
  .vh button { background:#1e293b; color:var(--text); border:0; padding:5px 9px; border-radius:7px; font:inherit; font-size:12px; cursor:pointer; }
  .vh button.on { background:#0c4a6e; color:#e0f2fe; }
  .vs ul { list-style:none; margin:8px 0 0; padding:0; display:grid; gap:2px; }
  .vs li { display:flex; align-items:center; gap:8px; padding:3px 6px; border-radius:6px; font-size:13px; }
  .vs li.cur { background:#1e293b; } .vs .vi { flex:1; text-align:left; color:var(--text); text-decoration:none; }
  .vs .vx { background:none; border:0; color:var(--mute); cursor:pointer; }
  .vs .hint { padding:6px 0 0; }
  .cf { margin-top:10px; }
  .cfh { display:flex; align-items:center; gap:8px; } .cfh small { color:var(--mute); margin-right:auto; }
  .tog { background:#1e293b; color:var(--mute); border:0; padding:4px 10px; border-radius:999px; font:inherit; font-size:12px; cursor:pointer; }
  .tog.on { background:#0c4a6e; color:#e0f2fe; }
  .chips { display:flex; flex-wrap:wrap; gap:5px; margin:8px 0; }
  .chip { display:inline-flex; align-items:center; gap:5px; background:#111827; color:var(--mute); border:1px solid var(--line); padding:3px 8px; border-radius:999px; font:inherit; font-size:12px; cursor:pointer; }
  .chip .wire { width:12px; margin:0; } .chip small { opacity:.7; }
  .chip.on { background:#1e293b; color:var(--text); border-color:#334155; }
  .pc.cl { max-height:220px !important; }
  .cn { position:relative; padding-left:26px; }
  .cn .ck { position:absolute; left:0; top:1px; width:18px; height:18px; border-radius:5px; border:1px solid #475569; background:none; color:#0b1020; font-size:12px; line-height:16px; padding:0; cursor:pointer; }
  .cn .ck.on { background:var(--acc); border-color:var(--acc); }
  .cn.off > :not(.ck) { opacity:.45; }
  .cn .cgo { color:var(--text); text-decoration:none; padding:0; }
  #isobar { position:absolute; top:108px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:10px; background:rgba(17,24,39,.95); border:1px solid #f8fafc33; border-radius:999px; padding:6px 8px 6px 14px; font-size:13px; white-space:nowrap; max-width:calc(100% - 20px); }
  #isobar[hidden] { display:none; }
  #isobar span { color:var(--mute); overflow:hidden; text-overflow:ellipsis; }
  #isobar button { background:#1e293b; color:var(--text); border:0; padding:5px 10px; border-radius:999px; font:inherit; font-size:12px; cursor:pointer; }
  .iso-dot { width:8px; height:8px; border-radius:50%; background:#f8fafc; flex:none; }
  body.isolated #editor { opacity:.55; }
  #key { position:absolute; top:10px; right:10px; z-index:5; max-width:min(320px, calc(100% - 20px)); }
  #key .kbtn { display:block; margin-left:auto; background:rgba(17,24,39,.9); border:1px solid var(--line); color:var(--text); font:inherit; font-size:13px; padding:7px 12px; border-radius:10px; cursor:pointer; backdrop-filter:blur(6px); }
  #key .kbtn span { color:var(--mute); margin-left:4px; }
  #key.open .kbtn { border-bottom-left-radius:0; border-bottom-right-radius:0; }
  #key .kbody { background:rgba(17,24,39,.95); border:1px solid var(--line); border-radius:12px 0 12px 12px; padding:10px 12px; max-height:calc(100vh - 120px); overflow:auto; backdrop-filter:blur(6px); }
  #key .ks { display:grid; gap:5px; padding:6px 0; } #key .ks + .ks { border-top:1px solid var(--line); }
  #key .ks > b { font-size:12px; color:var(--mute); text-transform:uppercase; letter-spacing:.06em; }
  #key .kr { display:flex; align-items:flex-start; gap:8px; font-size:13px; line-height:1.3; }
  #key .kr > :first-child { margin-top:1px; }
  #key .kt { flex:1; min-width:0; }
  #key .kt small { display:block; color:var(--mute); font-size:11.5px; }
  #key .sw { width:14px; height:14px; border-radius:4px; flex:none; margin:0 3px 0 2px; }
  #key .sw.solid { background:#60a5fa; box-shadow:0 0 0 2px #93c5fd55; }
  #key .sw.faded { background:#60a5fa; opacity:.18; border:1px solid #475569; }
  #key .wire { width:20px; margin:6px 0 0; flex:none; }
  #key .arrow { width:20px; text-align:center; color:var(--mute); flex:none; }
  #key .shape { width:20px; height:20px; color:#cbd5e1; flex:none; } #key .shape svg { width:20px; height:20px; display:block; }
  .badge-k { width:20px; height:20px; border-radius:50%; background:#f8fafc; color:#0b1020; font-size:11px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; flex:none; }
  .docs { display:flex; flex-wrap:wrap; align-items:center; gap:4px 10px; margin-top:8px; font-size:13px; }
  .docs .dicon { font-size:12px; opacity:.8; }
  .docs a { color:#7dd3fc; text-decoration:none; border-bottom:1px solid #7dd3fc44; }
  .docs a:hover { color:#bae6fd; border-bottom-color:#bae6fd; }
  .docs.small { font-size:12px; margin:0 0 8px; } .docs.cd { margin:2px 0 2px; font-size:12px; }
  .docs.inherited::after { content:'(layer docs)'; color:var(--mute); font-size:11px; }
  .docs.flowdocs { border-top:1px solid var(--line); padding-top:6px; }
  .fcol { flex:1; min-width:0; } .fcol .lname { width:100%; }
  .mdocs { padding:10px 12px; border-bottom:1px solid var(--line); } .mdocs b { font-size:12px; color:var(--mute); text-transform:uppercase; letter-spacing:.06em; }
  .hasdocs { color:#7dd3fc; font-size:11px; margin-left:4px; }
  #updbar { position:absolute; top:108px; left:50%; transform:translateX(-50%); width:min(560px, calc(100% - 20px)); display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:#0c4a6e; color:#e0f2fe; border:1px solid #38bdf8; border-radius:12px; padding:10px 12px; font-size:13px; z-index:6; }
  #updbar[hidden] { display:none; } #updbar span { flex:1; min-width:220px; }
  #updbar button { background:#e0f2fe; color:#0b1020; border:0; padding:6px 12px; border-radius:8px; font:inherit; font-size:13px; cursor:pointer; font-weight:600; }
  #updbar button[data-act=keep] { background:transparent; color:#e0f2fe; border:1px solid #7dd3fc; font-weight:400; }
  @media (max-width: 819px) { #updbar { top:58px; } }
  .eye.on { background:#0c4a6e; color:#e0f2fe; }
  .flow .eye { margin-top:4px; flex:none; }
  .fdesc { display:block; color:var(--mute); font-size:12px; margin-top:2px; font-weight:400; }
  .pa.top { padding:10px 12px 6px; margin:0; }
  .rec { padding:12px 14px; }
  .field { display:grid; gap:6px; color:var(--mute); font-size:12px; }
  .field input { background:#0d1424; border:1px solid var(--line); color:var(--text); border-radius:8px; padding:8px 10px; font:inherit; }
  .rec .hint { padding:8px 0; }
  .steps { margin:4px 0; padding-left:22px; display:grid; gap:4px; }
  .steps li { font-size:13px; } .steps li span { margin-right:6px; }
  .steps button, .link { background:none; border:0; color:var(--mute); cursor:pointer; font:inherit; padding:0 2px; }
  .link { color:var(--acc); text-decoration:underline; }
  .pa button:disabled { opacity:.4; cursor:default; }
  #flowbar { position:absolute; right:10px; bottom:34px; width:min(420px, calc(100% - 20px)); background:rgba(17,24,39,.95); border:1px solid #334155; border-radius:12px; padding:12px; backdrop-filter:blur(6px); }
  #flowbar[hidden] { display:none; }
  .fh { display:flex; align-items:center; gap:10px; } .fh span { color:var(--mute); font-size:12px; }
  .fh .x { margin-left:auto; background:none; border:0; color:var(--mute); cursor:pointer; }
  .fs { margin:8px 0 10px; min-height:40px; }
  .ft { font-size:14px; display:flex; align-items:center; flex-wrap:wrap; gap:6px; }
  .ft .badge { margin-left:0; }
  .num { background:#f8fafc; color:#0b1020; border-radius:999px; width:22px; height:22px; display:inline-flex; align-items:center; justify-content:center; font-weight:700; font-size:12px; }
  .fn { color:#cbd5e1; font-size:13px; margin-top:4px; }
  .fc { display:flex; gap:6px; flex-wrap:wrap; }
  .fc button { background:#1e293b; color:var(--text); border:0; padding:7px 11px; border-radius:8px; font:inherit; font-size:13px; cursor:pointer; }
  .fc button.on { background:#0c4a6e; } .fc button:disabled { opacity:.35; cursor:default; }
  body.side-hidden #app { grid-template-columns: 1fr; }
  body.side-hidden aside { display:none; }
  body.side-hidden main { grid-column:1; grid-row:1 / -1; }
  #sidebar.on { background:#0c4a6e; color:#e0f2fe; }
  @media (max-width: 819px) {
    .toolbar { right:10px; }
    #key { top:58px; }
    #key .kbody { max-height:calc(100vh - 200px); }
    #flowbar { left:10px; right:10px; width:auto; bottom:10px; }
    body.flow-on #props { display:none; }
    #app { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
    main { grid-row:1; }
    aside { grid-row:2; border-right:0; border-top:1px solid var(--line); height:46px; }
    body.panel-open aside { height:48vh; }
    .brand { display:none; }
    .tabs { border-bottom:0; }
    body.panel-open .tabs { border-bottom:1px solid var(--line); }
    body:not(.panel-open) .pane { display:none !important; }
    .toolbar { flex-wrap:nowrap; overflow-x:auto; pointer-events:auto; padding-bottom:4px; }
    .toolbar::-webkit-scrollbar { display:none; }
    .help { display:none; }
    #props { bottom:10px; }
  }
</style>
</head>
<body>
<div id="app">
  <aside>
    <div class="brand"><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15l9-4.5L12 6 3 10.5z" fill="#f59e0b" fill-opacity=".9"/><path d="M12 11.5l9-4.5L12 2.5 3 7z" fill="#14cc80" fill-opacity=".75"/><path d="M12 18.5l9-4.5-2.2-1.1L12 16.3l-6.8-3.4L3 14z" fill="#38bdf8" fill-opacity=".85"/><path d="M12 22l9-4.5-2.2-1.1L12 19.8l-6.8-3.4L3 17.5z" fill="#a78bfa" fill-opacity=".85"/></svg><b>Sloyka</b><span>architecture, layer by layer · <span id="ver"></span></span></div>
    <div class="tabs">
      <button class="tab" data-tab="model">Model</button>
      <button class="tab" data-tab="outline">Outline</button>
      <button class="tab" data-tab="layers">Layers</button>
      <button class="tab" data-tab="flows">Flows</button>
      <button class="tab" data-tab="links">Links</button>
    </div>
    <div class="pane" data-pane="model">
      <textarea id="editor" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="YAML model"></textarea>
      <div id="msgs"></div>
    </div>
    <div class="pane" data-pane="outline" hidden><div id="outline"></div></div>
    <div class="pane" data-pane="layers" hidden><div id="layers"></div></div>
    <div class="pane" data-pane="flows" hidden><div id="flows"></div></div>
    <div class="pane" data-pane="links" hidden><div id="links"></div></div>
  </aside>
  <main>
    <div id="viewport"></div>
    <div class="toolbar">
      <div class="group">
        <button id="sidebar" title="Hide or show the side panel ( \ )" aria-label="Toggle side panel">☰</button>
      </div>
      <div class="group">
        <button data-view="iso" title="Isometric view">Iso</button>
        <button data-view="top" title="Top-down view">Top</button>
        <button data-view="front" title="Front view">Front</button>
        <button id="back" title="Previous camera position">↩ Back</button>
      </div>
      <div class="group">
        <button data-toggle="move" title="Move the selected element in 3D (G)">✥ Move</button>
        <button data-toggle="snap" title="Snap moves to a 0.5 grid">Snap</button>
        <button data-toggle="flow" title="Animate flow along wires">Flow</button>
        <button data-toggle="solid" title="Make focused containers fully opaque">Solid</button>
        <label>Glass <input id="opacity" type="range" min="0.3" max="3" step="0.1" value="1" aria-label="Container opacity"></label>
      </div>
      <div class="group">
        <button id="lminus" title="Smaller focused labels (-)">A−</button>
        <button id="lsize" title="Reset focused label size">100%</button>
        <button id="lplus" title="Bigger focused labels (+)">A+</button>
      </div>
      <div class="group">
        <button id="undo" title="Undo (Ctrl/Cmd+Z)">↶</button>
        <button id="redo" title="Redo">↷</button>
        <button id="png" title="Snapshot as PNG">PNG</button>
        <button id="copy" title="Copy the YAML model">Copy YAML</button>
        <button id="import" title="Load a YAML file">Open…</button>
        <select id="sample" title="Load an example model" aria-label="Examples"><option value="">Examples…</option><option value="aws-web">AWS three-tier web app</option><option value="aws-serverless">AWS serverless orders</option><option value="aws-data">AWS data lake</option><option value="simple">Simple AWS app</option></select>
        <input id="file" type="file" accept=".yaml,.yml,.txt,text/yaml" hidden>
      </div>
    </div>
    <div id="props" hidden></div>
    <div id="flowbar" hidden></div>
    <div id="isobar" hidden></div>
    <div id="key"></div>
    <div id="updbar" hidden></div>
    <div id="toast" hidden></div>
    <div class="help">Drag to orbit · right-drag or two fingers to pan · scroll to zoom · click to select an element or a wire · Shift-click to add to the view · double-click to fly in · +/− focused label size · G move · P parent · F focus · \ side panel · Esc clear</div>

version: 1

layers:
  - { id: users,    name: Users & channels, color: "#f59e0b" }
  - { id: services, name: Services,         color: "#3b82f6" }
  - { id: data,     name: Data,             color: "#10b981" }
  - { id: infra,    name: Infrastructure,   color: "#8b5cf6" }

elements:
  - id: customer
    name: Customer
    type: actor
    layer: users
    pos: [0, 7, -12]

  - id: partner
    name: Partner API client
    type: actor
    layer: users
    pos: [9, 7, -12]

  - id: aws
    name: AWS ap-southeast-2
    type: boundary
    layer: infra
    children:
      - id: edge
        name: Edge
        type: system
        layer: infra
        pos: [0, 6, -4]
        children:
          - { id: cdn, name: CloudFront CDN, type: component, layer: services }
          - { id: waf, name: WAF, type: component, layer: infra }

      - id: vpc
        name: Production VPC
        type: boundary
        layer: infra
        pos: [0, 0, 4]
        children:
          - id: eks
            name: EKS cluster
            type: system
            layer: infra
            pos: [-4, 0, 0]
            children:
              - id: web
                name: Web app
                type: container
                layer: services
                children:
                  - { id: ui,  name: UI server, type: component, layer: services }
                  - { id: bff, name: BFF,       type: component, layer: services }
              - id: orders
                name: Orders service
                type: container
                layer: services
                children:
                  - { id: orders-api, name: Orders API, type: component, layer: services }
                  - { id: orders-worker, name: Worker, type: component, layer: services }
          - id: data-tier
            name: Data tier
            type: system
            layer: data
            pos: [7, -3, 0]
            children:
              - { id: pg,    name: Postgres,   type: datastore, layer: data }
              - { id: redis, name: Redis,      type: datastore, layer: data }
              - { id: queue, name: Order events, type: queue,   layer: data }

  - id: payments
    name: Stripe
    type: system
    layer: services
    pos: [-14, 0, 4]

connections:
  - { from: customer, to: cdn, type: sync, label: HTTPS }
  - { from: partner, to: waf, type: sync, label: REST }
  - { from: cdn, to: ui, type: sync }
  - { from: waf, to: orders-api, type: sync }
  - { from: ui, to: bff, type: sync }
  - { from: bff, to: orders-api, type: sync, label: gRPC }
  - { from: bff, to: redis, type: sync, label: cache }
  - { from: orders-api, to: pg, type: sync, label: SQL }
  - { from: orders-api, to: queue, type: async, label: OrderPlaced }
  - { from: queue, to: orders-worker, type: async }
  - { from: orders-worker, to: payments, type: sync, label: charge }
  - { from: pg, to: redis, type: replication }

flows:
  - id: place-order
    name: Place an order
    steps:
      - { from: customer, to: cdn, note: Customer opens the shop. }
      - { from: cdn, to: ui }
      - { from: ui, to: bff }
      - { from: bff, to: orders-api, note: BFF calls the Orders API over gRPC. }
      - { from: orders-api, to: pg, note: The order is written to Postgres. }
      - { from: orders-api, to: queue, note: An OrderPlaced event is published. }
      - { from: queue, to: orders-worker }
      - { from: orders-worker, to: payments, note: The worker charges the card. }

# Tip: Layers tab -> tap a layer to focus it. Flows tab -> play "AZ a goes down" to see the failover path.
version: 1
docs:
  - { title: AWS Well-Architected Framework, url: "https://docs.aws.amazon.com/wellarchitected/latest/framework/framework.html" }
  - { title: Regions and Availability Zones, url: "https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using-regions-availability-zones.html" }

layers:
  - { id: users,    name: Users & operators,     color: "#f59e0b" }
  - { id: edge,     name: Edge & DNS,            color: "#06b6d4", docs: { title: Amazon CloudFront, url: "https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/Introduction.html" } }
  - { id: network,  name: Network (VPC),         color: "#8b5cf6", docs: { title: Amazon VPC, url: "https://docs.aws.amazon.com/vpc/latest/userguide/what-is-amazon-vpc.html" } }
  - { id: app,      name: Application tier,      color: "#3b82f6", docs: { title: Amazon ECS, url: "https://docs.aws.amazon.com/AmazonECS/latest/developerguide/Welcome.html" } }
  - { id: data,     name: Data tier,             color: "#10b981", docs: { title: Amazon Aurora, url: "https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/CHAP_AuroraOverview.html" } }
  - { id: security, name: Identity & encryption, color: "#eab308", docs: { title: AWS Secrets Manager, url: "https://docs.aws.amazon.com/secretsmanager/latest/userguide/intro.html" } }
  - { id: ops,      name: Delivery & operations, color: "#ec4899", docs: { title: AWS CodePipeline, url: "https://docs.aws.amazon.com/codepipeline/latest/userguide/welcome.html" } }

elements:
  - id: customer
    name: Customer
    type: actor
    layer: users
    description: Uses the shop in a browser. Everything they load comes through CloudFront.
    pos: [-30, 5, 0]

  - id: operator
    name: On-call engineer
    type: actor
    layer: users
    description: Watches dashboards and gets paged by CloudWatch alarms.
    pos: [30, 5, 16]

  - id: github
    name: GitHub repository
    type: system
    layer: ops
    description: Application source and Dockerfile. A push to main starts the release pipeline through an AWS CodeConnections connection.
    docs: { title: AWS CodeConnections, url: "https://docs.aws.amazon.com/dtconsole/latest/userguide/welcome-connections.html" }
    pos: [30, 0, -16]

  - id: aws
    name: "AWS account: prod (us-east-1)"
    type: boundary
    layer: network
    description: Production account in one Region. The VPC spans two Availability Zones so that losing one AZ doesn't take the site down.
    pos: [0, 0, 0]
    children:
      - id: edge-svcs
        pos: [-17, 0.85, 13]
        name: Global edge
        type: system
        layer: edge
        description: Global AWS services that sit in front of the Region.
        children:
          - { id: route53, name: Route 53 hosted zone, type: component, description: "Public DNS for shop.example.com. An alias record points at the CloudFront distribution.", docs: { title: Amazon Route 53, url: "https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/Welcome.html" } }
          - { id: cloudfront, name: CloudFront distribution, type: component, description: "CDN and TLS termination. Serves /static/* from S3 (cached at the edge) and forwards everything else to the ALB.", docs: { title: Amazon CloudFront, url: "https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/Introduction.html" } }
          - { id: waf, name: AWS WAF web ACL, type: component, layer: security, description: "Managed rule groups (common exploits, bad bots) and rate limiting, attached to the distribution.", docs: { title: AWS WAF, url: "https://docs.aws.amazon.com/waf/latest/developerguide/waf-chapter.html" } }
          - { id: acm, name: ACM certificate, type: component, layer: security, description: "Public TLS certificate for shop.example.com. Issued and renewed automatically by AWS Certificate Manager.", docs: { title: AWS Certificate Manager, url: "https://docs.aws.amazon.com/acm/latest/userguide/acm-overview.html" } }

      - id: static-assets
        pos: [-9, 0.8, 13]
        name: S3 static assets
        type: datastore
        layer: edge
        description: Built JS, CSS and images. Private bucket, readable only by CloudFront through Origin Access Control.
        docs: { title: Amazon S3, url: "https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html" }

      - id: vpc
        pos: [0, 0.85, -5]
        name: VPC 10.0.0.0/16
        type: boundary
        description: One VPC with public, private app and private data subnets in each Availability Zone.
        docs: { title: Subnets, url: "https://docs.aws.amazon.com/vpc/latest/userguide/configure-subnets.html" }
        children:
          - { id: igw, name: Internet gateway, type: component, pos: [-6, 0.55, -7.5], description: "The VPC's route to the internet. Only the public subnets route to it directly.", docs: { title: Internet gateways, url: "https://docs.aws.amazon.com/vpc/latest/userguide/VPC_Internet_Gateway.html" } }
          - { id: alb, name: Application Load Balancer, type: component, pos: [6, 0.55, -7.5], layer: app, description: "Internet-facing ALB in both public subnets. Health-checks the Fargate tasks and only routes to healthy ones.", docs: { title: Application Load Balancers, url: "https://docs.aws.amazon.com/elasticloadbalancing/latest/application/introduction.html" } }

          - id: az-a
            pos: [-12.3, 0.85, 2]
            name: Availability Zone us-east-1a
            type: boundary
            description: One isolated data centre group. Everything here has a twin in AZ b.
            docs: { title: Regions and Availability Zones, url: "https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using-regions-availability-zones.html" }
            children:
              - id: pub-a
                name: Public subnet 10.0.0.0/24
                type: system
                children:
                  - { id: nat-a, name: NAT gateway, type: component, description: "Lets tasks in the private subnets make outbound calls without being reachable from the internet.", docs: { title: NAT gateways, url: "https://docs.aws.amazon.com/vpc/latest/userguide/vpc-nat-gateway.html" } }
              - id: app-a
                name: App subnet 10.0.10.0/24
                type: system
                layer: app
                children:
                  - id: task-a
                    name: Fargate task
                    type: container
                    description: One copy of the web service. Fargate runs it without any EC2 instances to manage.
                    docs: { title: AWS Fargate, url: "https://docs.aws.amazon.com/AmazonECS/latest/developerguide/AWS_Fargate.html" }
                    children:
                      - { id: web-a, name: web container, type: component, description: "The Node.js app. Renders pages and serves the JSON API on port 8080." }
                      - { id: logr-a, name: FireLens log router, type: component, layer: ops, description: "Sidecar that ships the app's stdout to CloudWatch Logs." }
              - id: data-a
                name: Data subnet 10.0.20.0/24
                type: system
                layer: data
                children:
                  - { id: aurora-writer, name: Aurora writer, type: datastore, description: "Aurora PostgreSQL primary instance. Takes all writes. Storage is shared with the reader and copied six ways across three AZs.", docs: { title: Amazon Aurora, url: "https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/CHAP_AuroraOverview.html" } }
                  - { id: redis-primary, name: ElastiCache primary, type: datastore, description: "Session and page-fragment cache. Multi-AZ with automatic failover.", docs: { title: Amazon ElastiCache, url: "https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/WhatIs.html" } }

          - id: az-b
            pos: [10.7, 0.85, 2]
            name: Availability Zone us-east-1b
            type: boundary
            description: The twin of AZ a. It can carry all traffic on its own if AZ a fails.
            children:
              - id: pub-b
                name: Public subnet 10.0.1.0/24
                type: system
                children:
                  - { id: nat-b, name: NAT gateway, type: component, description: "A NAT gateway per AZ, so outbound traffic doesn't depend on the other AZ.", docs: { title: NAT gateways, url: "https://docs.aws.amazon.com/vpc/latest/userguide/vpc-nat-gateway.html" } }
              - id: app-b
                name: App subnet 10.0.11.0/24
                type: system

flows:
  - id: page-load
    name: Load a product page
    color: "#38bdf8"
    description: A read request, from DNS to the database.
    steps:
      - { from: customer, to: route53, note: The browser looks up shop.example.com and gets the CloudFront address. }
      - { from: customer, to: cloudfront, note: "HTTPS to the nearest edge location. WAF rules run first." }
      - { from: cloudfront, to: static-assets, note: "JS, CSS and images come from the edge cache, or from S3 on a miss." }
      - { from: cloudfront, to: alb, note: The page itself isn't cached and goes to the ALB. }
      - { from: alb, to: web-a, note: The ALB picks a healthy task. This time it's the one in AZ a. }
      - { from: web-a, to: redis-primary, note: "Cache lookup for the product fragment. It's a miss." }
      - { from: web-a, to: aurora-reader, note: The product is read from the Aurora Replica. }
      - { from: web-a, to: logr-a, note: The request log goes to stdout. }
      - { from: logr-a, to: cloudwatch, note: FireLens ships it to CloudWatch Logs. }

  - id: place-order
    name: Place an order (write path)
    color: "#f97316"
    steps:
      - { from: customer, to: cloudfront, label: POST /api/orders }
      - { from: cloudfront, to: alb }
      - { from: alb, to: web-b, note: This request lands on the task in AZ b. }
      - { from: web-b, to: aurora-writer, note: "The order is written to the writer, which may be in the other AZ." }
      - { from: aurora-writer, to: aurora-reader, note: The replica sees the new row within milliseconds. }
      - { from: web-b, to: redis-primary, label: invalidate, note: The cached basket is cleared. }

  - id: release
    name: Ship a release
    color: "#ec4899"
    docs: { title: Rolling deployments, url: "https://docs.aws.amazon.com/AmazonECS/latest/developerguide/deployment-type-ecs.html" }
    steps:
      - { from: github, to: codepipeline, note: A merge to main starts the pipeline. }
      - { from: codepipeline, to: codebuild, note: CodeBuild runs the tests and builds the image. }
      - { from: codebuild, to: ecr, note: "The image is pushed with the commit SHA as its tag." }
      - { from: codepipeline, to: ecs-svc, note: The Deploy stage registers a new task definition revision. }
      - { from: ecs-svc, to: task-a, note: "A new task starts in AZ a and pulls the image from ECR." }
      - { from: ecs-svc, to: alb, note: "Once it passes ALB health checks, the old task is drained and stopped." }
      - { from: ecs-svc, to: task-b, note: Then the same happens in AZ b. No downtime. }

  - id: az-failover
    name: AZ a goes down
    color: "#ef4444"
    description: What keeps the site up when one Availability Zone fails.
    docs: { title: Aurora high availability, url: "https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Concepts.AuroraHighAvailability.html" }
    steps:
      - { from: alb, to: web-b, note: "Health checks to AZ a fail, so the ALB sends all traffic to AZ b." }
      - { from: aurora-reader, to: aurora-writer, type: flow, label: promote, note: "Aurora fails over: the replica in AZ b becomes the new writer and the cluster endpoint moves to it." }
      - { from: redis-replica, to: redis-primary, type: flow, label: promote, note: "ElastiCache promotes the replica in AZ b to primary." }
      - { from: ecs-svc, to: task-b, note: "ECS starts replacement tasks in the healthy AZ to get back to two." }
      - { from: cloudwatch, to: operator, note: "Alarms page on-call, but nobody has to act for the site to stay up." }
`;var Wf=`# AWS serverless order processing: API Gateway + Lambda + DynamoDB, with EventBridge, SQS and Step Functions.
# Tip: Flows tab -> play "Payment authorised" to follow one order from a webhook to the confirmation email.
version: 1
docs:
  - { title: Serverless Applications Lens, url: "https://docs.aws.amazon.com/wellarchitected/latest/serverless-applications-lens/welcome.html" }

layers:
  - { id: clients,  name: Clients & partners,   color: "#f59e0b" }
  - { id: edge,     name: Front end,            color: "#06b6d4", docs: { title: Amazon CloudFront, url: "https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/Introduction.html" } }
  - { id: identity, name: Identity,             color: "#eab308", docs: { title: Amazon Cognito, url: "https://docs.aws.amazon.com/cognito/latest/developerguide/what-is-amazon-cognito.html" } }
  - { id: api,      name: API & functions,      color: "#3b82f6", docs: [{ title: Amazon API Gateway, url: "https://docs.aws.amazon.com/apigateway/latest/developerguide/welcome.html" }, { title: AWS Lambda, url: "https://docs.aws.amazon.com/lambda/latest/dg/welcome.html" }] }
  - { id: events,   name: Events & workflows,   color: "#ec4899", docs: { title: Amazon EventBridge, url: "https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-what-is.html" } }
  - { id: data,     name: Data,                 color: "#10b981", docs: { title: Amazon DynamoDB, url: "https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Introduction.html" } }
  - { id: ops,      name: Observability,        color: "#94a3b8", docs: { title: Amazon CloudWatch, url: "https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/WhatIsCloudWatch.html" } }

elements:
  - id: shopper
    name: Shopper (web / mobile)
    type: actor
    layer: clients
    description: Signs in, places orders and gets a confirmation email.
    pos: [-30, 5, -6]

  - id: psp
    name: Payment provider
    type: system
    layer: clients
    description: "Third-party payments. Takes the card details itself, then calls our webhook when a payment is authorised."
    pos: [-30, 0, 14]

  - id: aws
    name: "AWS account: shop-prod"
    type: boundary
    layer: api
    description: Fully serverless. There are no servers or VPC to manage, and every part scales to zero.
    pos: [0, 0, 0]
    children:
      - id: frontend
        name: Web front end
        type: system
        layer: edge
        children:
          - { id: cloudfront, name: CloudFront, type: component, description: "Serves the single-page app over HTTPS.", docs: { title: Amazon CloudFront, url: "https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/Introduction.html" } }
          - { id: site-bucket, name: S3 site bucket, type: datastore, description: "The built SPA (HTML, JS, CSS). Private, read through Origin Access Control.", docs: { title: Amazon S3, url: "https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html" } }

      - id: cognito
        name: Cognito user pool
        type: system
        layer: identity
        description: Sign-up, sign-in and tokens for shoppers.
        docs: { title: Cognito user pools, url: "https://docs.aws.amazon.com/cognito/latest/developerguide/cognito-user-pools.html" }
        children:
          - { id: login, name: Managed login, type: component, description: "Hosted sign-in pages. Returns ID and access tokens (JWTs) to the app with OAuth 2.0." }
          - { id: users, name: User directory, type: datastore, description: "Shopper profiles and credentials, with MFA." }

      - id: http-api
        name: HTTP API (API Gateway)
        type: system
        layer: api
        description: "The single public API. /orders needs a shopper's JWT, and /webhooks/payments is checked with the provider's signature instead."
        docs: { title: Amazon API Gateway, url: "https://docs.aws.amazon.com/apigateway/latest/developerguide/welcome.html" }
        children:
          - { id: routes, name: Routes, type: component, description: "POST /orders, GET /orders/{id}, POST /webhooks/payments" }
          - { id: jwt-auth, name: JWT authorizer, type: component, layer: identity, description: "Checks the Cognito access token on /orders routes before Lambda is called.", docs: { title: JWT authorizers, url: "https://docs.aws.amazon.com/apigateway/latest/developerguide/http-api-jwt-authorizer.html" } }

      - id: fns
        name: Lambda functions
        type: container
        layer: api
        description: One small function per job. Each has its own IAM role with only the permissions it needs.
        docs: { title: AWS Lambda, url: "https://docs.aws.amazon.com/lambda/latest/dg/welcome.html" }
        children:
          - { id: fn-create, name: createOrder, type: component, description: "Validates the basket and writes a PENDING order." }
          - { id: fn-get, name: getOrder, type: component, description: "Reads one order for the signed-in shopper." }
          - { id: fn-webhook, name: paymentWebhook, type: component, description: "Verifies the provider's signature and marks the order AUTHORISED." }
          - { id: fn-inventory, name: updateInventory, type: component, description: "Reads batches from SQS and reserves stock.", docs: { title: Lambda with SQS, url: "https://docs.aws.amazon.com/lambda/latest/dg/with-sqs.html" } }

      - id: tables
        name: DynamoDB
        type: system
        layer: data
        docs: { title: Amazon DynamoDB, url: "https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Introduction.html" }
        children:
          - { id: orders-table, name: Orders table, type: datastore, description: "On-demand capacity. Partition key: orderId." }
          - { id: inventory-table, name: Inventory table, type: datastore, description: "Stock per SKU, updated with conditional writes so stock never goes negative." }
          - { id: ddb-stream, name: Orders stream, type: queue, layer: events, description: "DynamoDB Streams: an ordered change record for every write to the Orders table.", docs: { title: DynamoDB Streams, url: "https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Streams.html" } }

      - id: eventing
        name: Event routing
        type: system
        layer: events
        children:
          - { id: pipe, name: EventBridge Pipe, type: component, description: "Reads the stream, filters to status changes and turns them into OrderCreated and OrderAuthorised events.", docs: { title: EventBridge Pipes, url: "https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-pipes.html" } }
          - { id: bus, name: "Event bus: orders", type: queue, description: "Rules route each event type to its consumers. New consumers can subscribe without touching the producers.", docs: { title: Amazon EventBridge, url: "https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-what-is.html" } }
          - { id: inv-queue, name: "SQS: inventory-updates", type: queue, description: "Buffers OrderCreated events so stock updates can be retried and batched.", docs: { title: Amazon SQS, url: "https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/welcome.html" } }
          - { id: dlq, name: "SQS: inventory-dlq", type: queue, description: "Dead-letter queue for messages that failed five times.", docs: { title: Dead-letter queues, url: "https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-dead-letter-queues.html" } }
          - { id: sns, name: "SNS: order-status", type: queue, description: "Fans status changes out to mobile push.", docs: { title: Amazon SNS, url: "https://docs.aws.amazon.com/sns/latest/dg/welcome.html" } }

      - id: sfn
        name: "Step Functions: fulfilOrder"
        type: container
        layer: events
        description: A workflow for each authorised order. Every state retries on its own, and a failed charge goes down a compensation path.
        docs: { title: AWS Step Functions, url: "https://docs.aws.amazon.com/step-functions/latest/dg/welcome.html" }
        children:
          - { id: st-reserve, name: ReserveStock, type: component, description: "Confirms the stock that was reserved for the order." }
          - { id: st-capture, name: CapturePayment, type: component, description: "Captures the authorised payment with the provider." }
          - { id: st-ship, name: CreateShipment, type: component, description: "Books the courier and stores the tracking number." }
          - { id: st-notify, name: NotifyCustomer, type: component, description: "Sends the confirmation email and a push notification." }

      - id: ses
        name: Amazon SES
        type: component
        layer: events
        description: Sends transactional email.
        docs: { title: Amazon SES, url: "https://docs.aws.amazon.com/ses/latest/dg/Welcome.html" }

      - id: observability
        name: Observability
        type: system
        layer: ops
        children:
          - { id: cloudwatch, name: CloudWatch, type: component, description: "Function logs and metrics, plus an alarm when the DLQ isn't empty.", docs: { title: Amazon CloudWatch, url: "https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/WhatIsCloudWatch.html" } }
          - { id: xray, name: X-Ray, type: component, description: "Traces requests from API Gateway through Lambda and Step Functions.", docs: { title: AWS X-Ray, url: "https://docs.aws.amazon.com/xray/latest/devguide/aws-xray.html" } }

connections:
  - { from: shopper, to: cloudfront, type: sync, label: HTTPS }

flows:
  - id: sign-in
    name: Sign in
    color: "#eab308"
    steps:
      - { from: shopper, to: cloudfront, note: The browser loads the single-page app. }
      - { from: cloudfront, to: site-bucket }
      - { from: shopper, to: login, note: "The app redirects to the Cognito managed login." }
      - { from: login, to: users, note: "Cognito checks the password and MFA, then returns tokens to the app." }

  - id: place-order
    name: Place an order
    color: "#38bdf8"
    steps:
      - { from: shopper, to: routes, note: POST /orders with the access token. }
      - { from: routes, to: jwt-auth, note: "API Gateway checks the JWT. A bad token gets a 401 and Lambda never runs." }
      - { from: routes, to: fn-create }
      - { from: fn-create, to: orders-table, note: "The order is saved as PENDING and the API returns 201." }
      - { from: orders-table, to: ddb-stream, note: Everything from here on runs asynchronously. }
      - { from: ddb-stream, to: pipe }
      - { from: pipe, to: bus, note: The pipe publishes OrderCreated. }
      - { from: bus, to: inv-queue }
      - { from: inv-queue, to: fn-inventory }
      - { from: fn-inventory, to: inventory-table, note: Stock is reserved with a conditional write. }

    name: Payment authorised
    color: "#f97316"
    steps:
      - { from: psp, to: routes, note: "The provider calls the webhook after the shopper confirms payment on its hosted page." }
      - { from: routes, to: fn-webhook, note: "The function checks the signature. Repeat deliveries are ignored." }
      - { from: fn-webhook, to: orders-table, note: "The order is set to AUTHORISED." }
      - { from: orders-table, to: ddb-stream }
      - { from: ddb-stream, to: pipe }
      - { from: pipe, to: bus, note: The pipe publishes OrderAuthorised. }
      - { from: bus, to: sfn, note: An EventBridge rule starts a fulfilOrder execution. }
      - { from: st-reserve, to: st-capture }
      - { from: st-capture, to: psp, note: The payment is captured. }
      - { from: st-capture, to: st-ship }
      - { from: st-ship, to: st-notify }
      - { from: st-notify, to: ses }
      - { from: ses, to: shopper, note: The confirmation email arrives. }

    name: A stock update keeps failing
    color: "#ef4444"
    docs: { title: Dead-letter queues, url: "https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-dead-letter-queues.html" }
    steps:
      - { from: inv-queue, to: fn-inventory, note: "The function throws, for example on an unknown SKU, and the message goes back on the queue." }
      - { from: inv-queue, to: fn-inventory, note: "It's retried until maxReceiveCount (5) is reached." }
      - { from: inv-queue, to: dlq, note: "SQS moves the message to the dead-letter queue, so it stops blocking the others." }
      - { from: dlq, to: cloudwatch, note: "The alarm fires. Once the bug is fixed, the message can be sent back to the main queue." }

  - { title: Analytics Lens, url: "https://docs.aws.amazon.com/wellarchitected/latest/analytics-lens/analytics-lens.html" }

layers:
  - { id: sources,    name: Sources,                color: "#f59e0b" }
  - { id: ingest,     name: Ingestion,              color: "#ec4899", docs: { title: Amazon Kinesis Data Streams, url: "https://docs.aws.amazon.com/streams/latest/dev/introduction.html" } }
  - { id: storage,    name: S3 data lake,           color: "#10b981", docs: { title: Amazon S3, url: "https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html" } }
  - { id: catalog,    name: Catalog & governance,   color: "#eab308", docs: { title: AWS Lake Formation, url: "https://docs.aws.amazon.com/lake-formation/latest/dg/what-is-lake-formation.html" } }
  - { id: processing, name: Processing,             color: "#3b82f6", docs: { title: AWS Glue, url: "https://docs.aws.amazon.com/glue/latest/dg/what-is-glue.html" } }
  - { id: consume,    name: Analytics & BI,         color: "#06b6d4", docs: { title: Amazon Athena, url: "https://docs.aws.amazon.com/athena/latest/ug/what-is.html" } }

elements:
  - id: apps
    name: Web & mobile apps
    type: system
    layer: sources
    description: Send clickstream events (page views, add-to-basket, checkout) as they happen.
    pos: [-32, 0, -10]

  - id: onprem
    name: On-premises data centre
    type: boundary
    layer: sources
    description: The legacy orders system still runs here.
    pos: [-32, 0, 12]
    children:
      - { id: orders-db, name: Orders DB (PostgreSQL), type: datastore, description: "System of record for orders. Logical replication is turned on so DMS can read changes." }
      - { id: cgw, name: Customer gateway, type: component, description: "The on-premises end of the VPN." }

  - id: analyst
    name: Business analyst
    type: actor
    layer: consume
    description: Builds dashboards and runs ad-hoc SQL.
    pos: [32, 5, 10]

  - id: engineer
    name: Data engineer
    type: actor
    layer: processing
    description: Owns the pipelines and the table definitions.
    pos: [32, 5, -12]

  - id: aws
    name: "AWS account: analytics"
    type: boundary
    layer: storage
    description: A dedicated analytics account. Producers write in, and consumers get read access through Lake Formation.
    pos: [0, 0, 0]
    children:
      - id: ingestion
        name: Ingestion
        type: system
        layer: ingest
        children:
          - { id: kds, name: "Kinesis Data Streams: clickstream", type: queue, description: "Takes in events in real time. On-demand capacity, with 24 hours of retention for replay.", docs: { title: Kinesis Data Streams, url: "https://docs.aws.amazon.com/streams/latest/dev/introduction.html" } }
          - { id: firehose, name: Amazon Data Firehose, type: component, description: "Buffers events, converts them to Parquet and writes them to S3 partitioned by date.", docs: { title: Amazon Data Firehose, url: "https://docs.aws.amazon.com/firehose/latest/dev/what-is-this-service.html" } }
          - { id: vpn, name: Site-to-Site VPN, type: component, description: "Encrypted IPsec tunnel to the data centre.", docs: { title: AWS Site-to-Site VPN, url: "https://docs.aws.amazon.com/vpn/latest/s2svpn/VPC_VPN.html" } }
          - { id: dms, name: DMS replication task, type: component, description: "A full load first, then ongoing change data capture (CDC) from the Orders DB.", docs: [{ title: AWS DMS, url: "https://docs.aws.amazon.com/dms/latest/userguide/Welcome.html" }, { title: DMS change data capture, url: "https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Task.CDC.html" }] }

      - id: lake
        name: S3 data lake
        type: system
        layer: storage
        description: "Three zones, each in its own bucket prefix. Every zone is encrypted with KMS."
        children:
          - { id: raw, name: Raw zone, type: datastore, description: "Data exactly as it arrived. Never edited, so anything downstream can be rebuilt from it." }
          - { id: curated, name: Curated zone, type: datastore, description: "Cleaned, de-duplicated Parquet tables, partitioned by date." }
          - { id: analytics-zone, name: Analytics zone, type: datastore, description: "Business-level aggregates: daily sales, funnels, cohorts." }
          - { id: archive, name: Glacier archive, type: datastore, description: "Raw data older than 90 days. Cheap to keep, slower to read back.", docs: { title: S3 Lifecycle, url: "https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lifecycle-mgmt.html" } }

      - id: governance
        name: Catalog & governance
        type: system
        layer: catalog
        children:
          - { id: glue-catalog, name: Glue Data Catalog, type: datastore, description: "Table schemas and partitions. Athena, Redshift and the Glue jobs all read it.", docs: { title: Glue Data Catalog, url: "https://docs.aws.amazon.com/glue/latest/dg/components-overview.html" } }
          - { id: crawler, name: Glue crawler, type: component, description: "Finds new partitions and schema changes in the raw zone.", docs: { title: Glue crawlers, url: "https://docs.aws.amazon.com/glue/latest/dg/add-crawler.html" } }
          - { id: lakeformation, name: Lake Formation, type: component, description: "Central permissions: who can see which databases, tables, columns and rows.", docs: { title: AWS Lake Formation, url: "https://docs.aws.amazon.com/lake-formation/latest/dg/what-is-lake-formation.html" } }
          - { id: kms, name: KMS key, type: component, description: "Encrypts every bucket in the lake.", docs: { title: AWS KMS, url: "https://docs.aws.amazon.com/kms/latest/developerguide/overview.html" } }

      - id: etl
        name: Processing
        type: system
        layer: processing
        children:
          - { id: scheduler, name: EventBridge Scheduler, type: component, description: "Starts the nightly run at 02:00 UTC.", docs: { title: EventBridge Scheduler, url: "https://docs.aws.amazon.com/scheduler/latest/UserGuide/what-is-scheduler.html" } }
          - { id: workflow, name: Glue workflow, type: component, description: "Runs the crawler and both jobs in order, and stops if a step fails.", docs: { title: Glue workflows, url: "https://docs.aws.amazon.com/glue/latest/dg/workflows_overview.html" } }
          - { id: job-clean, name: "Glue job: raw to curated", type: component, description: "Spark job. Applies the latest CDC changes, removes duplicates and fixes types." }
          - { id: job-agg, name: "Glue job: curated to analytics", type: component, description: "Spark job that builds the business aggregates." }

      - id: bi
        name: Analytics & BI
        type: system
        layer: consume
        children:
          - { id: athena, name: Athena, type: component, description: "Serverless SQL straight on S3. You pay for the data each query scans.", docs: { title: Amazon Athena, url: "https://docs.aws.amazon.com/athena/latest/ug/what-is.html" } }
          - { id: redshift, name: Redshift Serverless, type: datastore, description: "Warehouse for heavy BI workloads. Also queries the lake in place with Redshift Spectrum.", docs: [{ title: Redshift Serverless, url: "https://docs.aws.amazon.com/redshift/latest/mgmt/working-with-serverless.html" }, { title: Redshift Spectrum, url: "https://docs.aws.amazon.com/redshift/latest/dg/c-using-spectrum.html" }] }
          - { id: quicksight, name: QuickSight, type: component, description: "Dashboards for the business, on Athena and Redshift.", docs: { title: Amazon Quick user guide, url: "https://docs.aws.amazon.com/quick/latest/userguide/what-is.html" } }

connections:
  - { from: apps, to: kds, type: data, label: PutRecords }
  - { from: kds, to: firehose, type: async }
  - { from: firehose, to: raw, type: data, label: Parquet every 5 min }
  - { from: cgw, to: vpn, type: network, label: IPsec tunnel }
  - { from: orders-db, to: dms, type: replication, label: full load + CDC }
  - { from: dms, to: raw, type: data, label: change files }
  - { from: raw, to: archive, type: lifecycle, label: after 90 days }
  - { from: raw, to: kms, type: depends, label: SSE-KMS }
  - { from: scheduler, to: workflow, type: lifecycle, label: nightly }
  - { from: workflow, to: crawler, type: lifecycle, label: 1. crawl }
  - { from: workflow, to: job-clean, type: lifecycle, label: 2. clean }
  - { from: workflow, to: job-agg, type: lifecycle, label: 3. aggregate }
  - { from: crawler, to: raw, type: depends, label: scans }
  - { from: crawler, to: glue-catalog, type: data, label: tables + partitions }
  - { from: raw, to: job-clean, type: data }
  - { from: job-clean, to: curated, type: data }
  - { from: curated, to: job-agg, type: data }
  - { from: job-agg, to: analytics-zone, type: data }
  - { from: job-agg, to: redshift, type: data, label: COPY }
  - { from: lakeformation, to: glue-catalog, type: auth, label: governs }
  - { from: lakeformation, to: athena, type: auth, label: column + row grants }
  - { from: lakeformation, to: redshift, type: auth }
  - { from: athena, to: glue-catalog, type: depends, label: schemas }
  - { from: athena, to: curated, type: sync, label: scan }
  - { from: athena, to: analytics-zone, type: sync, label: scan }
  - { from: redshift, to: glue-catalog, type: depends, label: Spectrum schema }
  - { from: quicksight, to: athena, type: sync, label: SQL }
  - { from: quicksight, to: redshift, type: sync, label: SQL }
  - { from: analyst, to: quicksight, type: sync, label: dashboards }
  - { from: analyst, to: athena, type: sync, label: ad-hoc SQL }
  - { from: engineer, to: workflow, type: sync, label: monitor + rerun }

flows:
  - id: clickstream
    name: Clickstream into the lake
    color: "#ec4899"
    steps:
      - { from: apps, to: kds, note: Apps send events as they happen. }
      - { from: kds, to: firehose, note: "Firehose reads the stream and buffers up to 5 minutes or 128 MB." }
      - { from: firehose, to: raw, note: "It converts the events to Parquet and writes them under dt=YYYY-MM-DD/." }

  - id: cdc
    name: Orders change data capture
    color: "#f59e0b"
    steps:
      - { from: cgw, to: vpn, note: "The data centre connects to the VPC over the VPN." }
      - { from: orders-db, to: dms, note: "DMS does a full load once, then streams every insert, update and delete." }
      - { from: dms, to: raw, note: "Changes land as files with an operation column (I, U or D)." }

  - id: nightly
    name: Nightly ETL run
    color: "#3b82f6"
    docs: { title: Glue workflows, url: "https://docs.aws.amazon.com/glue/latest/dg/workflows_overview.html" }
    steps:
      - { from: scheduler, to: workflow, note: "02:00 UTC: the workflow starts." }
      - { from: workflow, to: crawler }
      - { from: crawler, to: glue-catalog, note: New partitions are added to the catalog. }
      - { from: workflow, to: job-clean }
      - { from: raw, to: job-clean, note: "Reads the new raw files and the CDC changes." }
      - { from: job-clean, to: curated, note: Writes de-duplicated Parquet tables. }
      - { from: workflow, to: job-agg }
      - { from: curated, to: job-agg }
      - { from: job-agg, to: analytics-zone, note: Writes the daily aggregates to the analytics zone. }
      - { from: job-agg, to: redshift, note: "Loads the same aggregates into Redshift for the dashboards." }
      - { from: raw, to: archive, note: "Separately, S3 Lifecycle moves raw objects older than 90 days to Glacier." }

  - id: query
    name: Analyst runs a query
    color: "#06b6d4"
    steps:
      - { from: analyst, to: quicksight, note: The analyst opens the sales dashboard. }
      - { from: quicksight, to: athena, note: QuickSight sends the SQL to Athena. }
      - { from: lakeformation, to: athena, note: "Lake Formation checks the analyst's grants. PII columns are hidden." }
      - { from: athena, to: glue-catalog, note: Athena looks up the table schema and partitions. }
      - { from: athena, to: analytics-zone, note: "It scans only the partitions it needs, and the result goes back to the dashboard." }
